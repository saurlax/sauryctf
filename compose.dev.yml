name: sauryctf-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sauryctf
      POSTGRES_USER: sauryctf
      POSTGRES_PASSWORD: sauryctf-dev
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sauryctf -d sauryctf]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    profiles: [s3]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: sauryctf
      MINIO_ROOT_PASSWORD: sauryctf-dev-secret
    ports:
      - 127.0.0.1:19000:9000
      - 127.0.0.1:19001:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    profiles: [s3]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 sauryctf sauryctf-dev-secret &&
        mc mb --ignore-existing local/sauryctf
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - 127.0.0.1:11025:1025
      - 127.0.0.1:18025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:

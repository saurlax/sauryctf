openapi: 3.1.0
info:
  title: SauryCTF Control Plane API
  version: 1.0.0-alpha.1
  description: Nuxt/Nitro Jeopardy control-plane API. Generated from shared Zod contracts.
paths:
  /api/health/live:
    get:
      operationId: getControlPlaneLiveness
      tags:
        - Health
      responses:
        "200":
          description: Nitro process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  component:
                    type: string
                    const: control-plane
                required:
                  - status
                  - component
                additionalProperties: false
  /api/health/ready:
    get:
      operationId: getControlPlaneReadiness
      tags:
        - Health
      responses:
        "200":
          description: Control plane has required deployment configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
                  component:
                    type: string
                    const: control-plane
                required:
                  - status
                  - component
                additionalProperties: false
        "503":
          description: Control plane is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      operationId: registerIdentity
      tags:
        - Identity
      parameters:
        - &a2
          name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must match the configured public control-plane origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                email:
                  type: string
                  maxLength: 320
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                turnstile_token:
                  type: string
                  minLength: 1
                  maxLength: 2048
              required:
                - username
                - email
                - password
              additionalProperties: false
      responses:
        "201":
          description: Identity registered and browser session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        allOf:
                          - type: string
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          - type: string
                            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                      username:
                        type: string
                        minLength: 1
                        maxLength: 64
                      email:
                        type: string
                        maxLength: 320
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      email_verified:
                        type: boolean
                      status:
                        type: string
                        enum:
                          - active
                          - banned
                      role:
                        type: string
                        enum:
                          - user
                          - organizer
                          - admin
                      session_version:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - username
                      - email
                      - email_verified
                      - status
                      - role
                      - session_version
                      - must_change_password
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
        "400": &a1
          description: Stable API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403": *a1
        "409": *a1
        "429": *a1
  /api/auth/login:
    post:
      operationId: loginIdentity
      tags:
        - Identity
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  minLength: 1
                  maxLength: 320
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                turnstile_token:
                  type: string
                  minLength: 1
                  maxLength: 2048
              required:
                - identifier
                - password
              additionalProperties: false
      responses:
        "200":
          description: Credentials accepted and browser session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        allOf:
                          - type: string
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          - type: string
                            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                      username:
                        type: string
                        minLength: 1
                        maxLength: 64
                      email:
                        type: string
                        maxLength: 320
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      email_verified:
                        type: boolean
                      status:
                        type: string
                        enum:
                          - active
                          - banned
                      role:
                        type: string
                        enum:
                          - user
                          - organizer
                          - admin
                      session_version:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - username
                      - email
                      - email_verified
                      - status
                      - role
                      - session_version
                      - must_change_password
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
        "400": *a1
        "401": *a1
        "403": *a1
        "429": *a1
  /api/auth/me:
    get:
      operationId: getCurrentIdentity
      tags:
        - Identity
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current authoritative identity projection
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        allOf:
                          - type: string
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          - type: string
                            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                      username:
                        type: string
                        minLength: 1
                        maxLength: 64
                      email:
                        type: string
                        maxLength: 320
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      email_verified:
                        type: boolean
                      status:
                        type: string
                        enum:
                          - active
                          - banned
                      role:
                        type: string
                        enum:
                          - user
                          - organizer
                          - admin
                      session_version:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - username
                      - email
                      - email_verified
                      - status
                      - role
                      - session_version
                      - must_change_password
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
        "401": *a1
  /api/auth/logout:
    post:
      operationId: logoutIdentity
      tags:
        - Identity
      security:
        - cookieSession: []
      parameters:
        - *a2
        - &a3
          name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
          description: Double-submit proof matching the sauryctf-csrf cookie.
      responses:
        "200":
          description: Browser session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out:
                    type: boolean
                    const: true
                required:
                  - logged_out
                additionalProperties: false
        "403": *a1
  /api/auth/password/change:
    post:
      operationId: changePassword
      tags:
        - Identity
      security:
        - cookieSession: []
      parameters:
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
                - current_password
                - new_password
              additionalProperties: false
      responses:
        "200":
          description: Password changed and current session refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                    const: true
                required:
                  - changed
                additionalProperties: false
        "400": *a1
        "401": *a1
        "409": *a1
  /api/auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      tags:
        - Identity
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 320
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                turnstile_token:
                  type: string
                  minLength: 1
                  maxLength: 2048
              required:
                - email
              additionalProperties: false
      responses:
        "202":
          description: Reset request accepted without account disclosure
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    const: true
                required:
                  - accepted
                additionalProperties: false
        "400": *a1
        "403": *a1
        "429": *a1
  /api/auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - Identity
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 512
                  pattern: ^[A-Za-z0-9_-]+$
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
                - token
                - new_password
              additionalProperties: false
      responses:
        "200":
          description: Password reset and any browser session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                    const: true
                required:
                  - changed
                additionalProperties: false
        "400": *a1
        "429": *a1
  /api/auth/email/verification/request:
    post:
      operationId: requestEmailVerification
      tags:
        - Identity
      security:
        - cookieSession: []
      parameters:
        - *a2
        - *a3
      responses:
        "202":
          description: Verification request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    const: true
                required:
                  - accepted
                additionalProperties: false
        "401": *a1
        "429": *a1
  /api/auth/email/change:
    post:
      operationId: changeEmail
      tags:
        - Identity
      security:
        - cookieSession: []
      parameters:
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 320
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Email changed, verification reset, and current session refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                    const: true
                required:
                  - changed
                additionalProperties: false
        "400": *a1
        "401": *a1
        "409": *a1
        "429": *a1
  /api/auth/email/verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags:
        - Identity
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 512
                  pattern: ^[A-Za-z0-9_-]+$
              required:
                - token
              additionalProperties: false
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    const: true
                required:
                  - verified
                additionalProperties: false
        "400": *a1
        "429": *a1
  /api/auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
        - Identity
      responses:
        "200":
          description: Double-submit CSRF token and matching cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                    minLength: 43
                    maxLength: 43
                    pattern: ^[A-Za-z0-9_-]+$
                required:
                  - csrf_token
                additionalProperties: false
  /api/admin/users/{userId}/role:
    patch:
      operationId: changeUserGlobalRole
      tags:
        - Administration
        - Identity
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - user
                    - organizer
                    - admin
              required:
                - role
              additionalProperties: false
      responses:
        "200":
          description: Global role changed and target sessions invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    allOf:
                      - type: string
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      - type: string
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  previous_role:
                    type: string
                    enum:
                      - user
                      - organizer
                      - admin
                  role:
                    type: string
                    enum:
                      - user
                      - organizer
                      - admin
                  session_version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  changed:
                    type: boolean
                required:
                  - user_id
                  - previous_role
                  - role
                  - session_version
                  - changed
                additionalProperties: false
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
  /api/admin/users:
    get:
      operationId: listManagedIdentities
      tags:
        - Administration
        - Identity
      security:
        - cookieSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            allOf:
              - type: string
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              - type: string
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Cursor-paginated user management projection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          allOf:
                            - type: string
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            - type: string
                              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                        username:
                          type: string
                          minLength: 1
                          maxLength: 64
                        email:
                          type: string
                          maxLength: 320
                          format: email
                          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                        email_verified:
                          type: boolean
                        status:
                          type: string
                          enum:
                            - active
                            - banned
                        role:
                          type: string
                          enum:
                            - user
                            - organizer
                            - admin
                        session_version:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        must_change_password:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d\.\d{3}(?:Z))$
                      required:
                        - id
                        - username
                        - email
                        - email_verified
                        - status
                        - role
                        - session_version
                        - must_change_password
                        - created_at
                      additionalProperties: false
                  page:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                          - type: string
                            allOf:
                              - type: string
                                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                              - type: string
                                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                          - type: "null"
                      has_more:
                        type: boolean
                    required:
                      - next_cursor
                      - has_more
                    additionalProperties: false
                required:
                  - items
                  - page
                additionalProperties: false
        "401": *a1
        "403": *a1
  /api/admin/users/{userId}/status:
    patch:
      operationId: changeUserStatus
      tags:
        - Administration
        - Identity
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - banned
              required:
                - status
              additionalProperties: false
      responses:
        "200":
          description: User status changed and target sessions invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    allOf:
                      - type: string
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      - type: string
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  previous_status:
                    type: string
                    enum:
                      - active
                      - banned
                  status:
                    type: string
                    enum:
                      - active
                      - banned
                  session_version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  changed:
                    type: boolean
                required:
                  - user_id
                  - previous_status
                  - status
                  - session_version
                  - changed
                additionalProperties: false
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
  /api/teams:
    get:
      operationId: getCurrentTeam
      tags:
        - Teams
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current team or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            allOf:
                              - type: string
                                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                              - type: string
                                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                          name:
                            type: string
                            minLength: 1
                            maxLength: 80
                          version:
                            type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          members:
                            type: array
                            items:
                              type: object
                              properties:
                                user_id:
                                  type: string

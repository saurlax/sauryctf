# Legacy-only generator configuration. The active public API is generated by
# apps/web and MUST NOT generate a Go HTTP server for apps/worker.
# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: http
output: legacy/go-monolith/internal/http/api.gen.go
generate:
  gin-server: true
  models: true
  strict-server: false
output-options:
  skip-prune: false
